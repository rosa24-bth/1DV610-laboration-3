<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebutik</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <p class="brand">Tebutik</p>
      <h1>Te för en god stund.</h1>
      <p>Upptäck våra tesorter och hitta din favorit.</p>
    </header>
    <main>
      <section>
        <h2>Våra teer</h2>
        <ul id="product-list" class="product-list"></ul>
      </section>
      <section class="cart">
        <h2>Din varukorg</h2>
        <p id="cart-empty">Din varukorg är tom.</p>
        <ul id="cart-list" class="cart-list"></ul>
        <form id="discount-form" class="discount-form" novalidate>
          <label for="discount-input">Rabatt (%)</label>
          <input id="discount-input" type="number" min="0" max="100" step="any" value="0">
          <button type="submit">Använd rabatt</button>
        </form>
        <p id="discount-error" class="error" role="alert"></p>
        <p>Delsumma: <span id="cart-subtotal">0.00 kr</span></p>
        <p>Rabatt: <span id="cart-discount">0 % (0.00 kr)</span></p>
        <p class="cart-total">Totalt: <span id="cart-total">0.00 kr</span></p>
        <button id="clear-cart" type="button">Töm varukorgen</button>
      </section>
      <section class="customer">
        <h2>Dina uppgifter</h2>
        <!-- The validation module checks the fields instead of the browser. -->
        <form id="customer-form" class="customer-form" novalidate>
          <label for="customer-name">Namn</label>
          <input id="customer-name" type="text" autocomplete="name" required>
          <label for="customer-email">E-postadress</label>
          <input id="customer-email" type="email" autocomplete="email" required>
          <button type="submit">Kontrollera uppgifter</button>
        </form>
        <ul id="customer-errors" class="error" role="alert"></ul>
        <p id="customer-status"></p>
      </section>
    </main>
  </body>
</html>
