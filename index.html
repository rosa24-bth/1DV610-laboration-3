<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebutik</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <p class="brand">Tebutik</p>
      <h1>Te för en god stund.</h1>
      <p>Upptäck våra tesorter och hitta din favorit.</p>
    </header>
    <main>
      <section aria-labelledby="products-heading">
        <h2 id="products-heading">Våra teer</h2>
        <ul id="product-list" class="product-list"></ul>
      </section>
      <section class="cart" aria-labelledby="cart-heading">
        <h2 id="cart-heading">Din varukorg</h2>
        <p id="cart-empty">Din varukorg är tom.</p>
        <ul id="cart-list" class="cart-list"></ul>
        <p class="cart-total">Totalt: <span id="cart-total" aria-live="polite">0 kr</span></p>
      </section>
    </main>
  </body>
</html>
